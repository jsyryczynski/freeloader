name: Release

# Pushing a version tag (e.g. v0.2.0) builds the app on Windows and
# publishes a release with the download and its source code. Running it
# by hand ("Run workflow"), or a pull request that changes the build,
# only builds, to check that a release would work; the files are then
# attached to the run instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - build-exe.bat
      - pom.xml
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $parts = @{}
          foreach ($line in Get-Content static/version.properties) {
            if ($line -match '^\s*(version\.\w+)\s*=\s*(\S+)') { $parts[$Matches[1]] = $Matches[2] }
          }
          $version = "$($parts['version.major']).$($parts['version.minor']).$($parts['version.tiny'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "The tag $env:GITHUB_REF_NAME doesn't match the version $version in static/version.properties"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # the libraries build-exe.bat downloads, kept between runs so most
      # releases download nothing (the key changes with the jar list)
      - name: Reuse downloaded libraries
        uses: actions/cache@v6
        with:
          path: lib
          key: libs-${{ hashFiles('build-exe.bat') }}

      # build-exe.bat uses JAVA_HOME, which setup-java points at JDK 25
      - name: Build the app
        shell: cmd
        run: build-exe.bat

      # A Windows installer around the same app folder, made by jpackage
      # with the WiX toolset that GitHub's Windows machines come with.
      # It installs per user (no administrator rights), offers a Start
      # menu entry and a desktop shortcut, lets people pick the folder,
      # and replaces an older version (same upgrade UUID every release).
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:WIX) { $env:PATH = "$env:WIX\bin;$env:PATH" }
          $options = @(
            '--app-image', 'dist\Freeloader', '--name', 'Freeloader', '--app-version', $env:VERSION,
            '--vendor', 'Jan Syryczynski', '--description', 'No upload BitTorrent client',
            '--license-file', 'LICENSE',
            '--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut', '--win-shortcut-prompt',
            '--win-upgrade-uuid', '02afc6ae-5538-4aa1-b1e7-17abd0133ab2',
            '--win-help-url', 'https://github.com/jsyryczynski/freeloader',
            '--win-update-url', 'https://github.com/jsyryczynski/freeloader/releases')
          jpackage --type exe --dest dist\installer @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\installer\Freeloader-$env:VERSION.exe" "dist\Freeloader-$env:VERSION-setup.exe"
          # the same installer as an .msi, only to test it below: an .msi
          # can be installed without any window
          jpackage --type msi --dest dist\installer @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the installer
        shell: pwsh
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $msi = Resolve-Path "dist\installer\Freeloader-$env:VERSION.msi"
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "installing failed: $($install.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter Freeloader.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Freeloader.exe was not installed" }
          Write-Host "installed: $($exe.FullName)"
          $help = & $exe.FullName --help 2>&1 | Out-String
          if ($help -notmatch 'usage') { Write-Host $help; throw "the installed app did not start" }
          Write-Host "the installed app starts: $($help.Split("`n")[0].Trim())"
          $remove = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstalling failed: $($remove.ExitCode)" }
          if (Test-Path $exe.FullName) { throw "uninstalling left Freeloader.exe behind" }
          Write-Host "uninstalled cleanly"
          # --help exits with 1, which would otherwise count as this step's result
          exit 0

      # the GPL asks for the source to go with the app: the code at this
      # version, without the git history
      - name: Pack the source code
        shell: pwsh
        run: git archive --format=zip --prefix="Freeloader-${{ steps.version.outputs.version }}-source/" -o "dist/Freeloader-${{ steps.version.outputs.version }}-source.zip" HEAD

      # in the format "sha256sum -c" reads: lowercase hash, two spaces, name
      - name: Write the checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = "Freeloader-$env:VERSION-setup.exe", "Freeloader-$env:VERSION.7z", "Freeloader-$env:VERSION-source.zip"
          $lines = foreach ($f in $files) { (Get-FileHash -Algorithm SHA256 "dist/$f").Hash.ToLower() + "  " + $f }
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Keep the files with the run
        uses: actions/upload-artifact@v7
        with:
          name: Freeloader-${{ steps.version.outputs.version }}
          path: |
            dist/Freeloader-${{ steps.version.outputs.version }}-setup.exe
            dist/Freeloader-${{ steps.version.outputs.version }}.7z
            dist/Freeloader-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          **Freeloader-$env:VERSION-setup.exe**: run it to install Freeloader for your Windows user (no administrator rights needed), with a Start menu entry and an uninstaller.

          **Freeloader-$env:VERSION.7z**: no install. Unpack it anywhere and run **Freeloader.exe** in the Freeloader folder. Windows 11 opens .7z files in Explorer; on older Windows use [7-Zip](https://www.7-zip.org/).

          No Java install is needed either way. The files aren't code-signed, so Windows may show "Windows protected your PC" the first time: choose "More info", then "Run anyway".

          **Freeloader-$env:VERSION-source.zip** is the source code of this version (GPL v2 or later).

          **SHA256SUMS.txt** has the SHA-256 checksum of each file, to check that a download is complete and unchanged: in PowerShell, ``Get-FileHash <file>`` prints it.
          "@
          # --generate-notes adds the pull requests merged since the previous
          # release below these notes
          gh release create $env:GITHUB_REF_NAME "dist/Freeloader-$env:VERSION-setup.exe" "dist/Freeloader-$env:VERSION.7z" "dist/Freeloader-$env:VERSION-source.zip" dist/SHA256SUMS.txt --title "Freeloader $env:VERSION" --notes $notes --generate-notes
