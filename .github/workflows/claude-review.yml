name: Claude review

# Claude reviews each pull request and comments on it. Runs only for pull
# requests from branches of this repository (pull requests from forks get
# no secrets), and only once the CLAUDE_CODE_OAUTH_TOKEN secret exists:
# create the token with "claude setup-token" and add it under Settings ->
# Secrets and variables -> Actions.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set, so there is no review."

      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to Freeloader, a Windows BitTorrent client in
            Java 25 with a JavaFX window, built with Maven and build-exe.bat.

            Look for, most important first:
            1. Bugs: wrong behaviour, missed edge cases, error handling.
            2. Thread safety: the network thread, the JavaFX thread and executor
               threads share state; watch for races and lock-order deadlocks.
            3. Anything that would send file data or an unchoke to a peer.
               Freeloader must never upload; NeverUploadTest guards this.
            4. Tests: new behaviour should be covered, and tests must not use
               the internet.
            5. Machine-specific paths, user names or email addresses in code,
               build files or docs.

            Put each specific problem in an inline comment on its line, and a
            short summary in one top-level comment. Skip style nitpicks. If
            there is nothing worth raising, say so in one sentence.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
