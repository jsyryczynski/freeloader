name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # every test on its own line in the log (the tests run as one
      # suite, so Maven otherwise prints a single total), and no
      # download progress noise
      - run: mvn -B -ntp test -Dsurefire.reportFormat=plain -Dsurefire.useFile=false
      # a table of every test on the run's summary page, and a check
      # on the PR listing them
      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Test results
          detailed_summary: true
          include_passed: true
